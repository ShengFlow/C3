name: C3 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    name: Build & Verify C3 (LLVM/MLIR Homebrew)
    runs-on: macos-14

    steps:
      - name: Checkout C3 repository
        uses: actions/checkout@v4
        with:
          path: c3

      - name: Checkout CTorch (host headers)
        uses: actions/checkout@v4
        with:
          repository: ShengFlow/CTorch
          ref: feature-DCU
          path: ctorch

      - name: Install LLVM & Ninja via Homebrew
        run: |
          brew install llvm ninja

      - name: Configure CMake
        run: |
          LLVM_PREFIX=$(brew --prefix llvm)
          cmake -B build -S c3 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DC3_ENABLE_LTO=OFF \
            -DCT_ENABLE_MLIR=ON \
            -DLLVM_DIR="${LLVM_PREFIX}/lib/cmake/llvm" \
            -DMLIR_DIR="${LLVM_PREFIX}/lib/cmake/mlir" \
            -DCMAKE_C_COMPILER_LAUNCHER="" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="" \
            -DC3_HOST_INCLUDE_DIRS="$GITHUB_WORKSPACE/ctorch/include;$GITHUB_WORKSPACE/ctorch/src"

      - name: Run TableGen Dialect Code Generation (C3Gen)
        run: |
          cmake --build build --target C3Gen

      - name: Build C3Core Library
        run: |
          cmake --build build --target C3Core -j$(sysctl -n hw.ncpu 2>/dev/null || echo 2)
